<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Forgot password · CloudVault</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/recovery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">CloudVault</a>
    <nav><a href="/login.html">Sign in</a></nav>
  </header>
  <main class="narrow">
    <section class="panel">
      <p class="eyebrow">Account recovery</p>
      <h1>Forgot password</h1>
      <p class="muted">Enter your username. A one-time reset link will be sent to the email address registered to an active account.</p>
      <form id="password-recovery-form">
        <label for="password-recovery-username">Username</label>
        <input id="password-recovery-username" name="username" required maxlength="50" autocomplete="username">
        <button id="password-recovery-submit" class="button full-width" type="submit">Send reset link</button>
      </form>
      <p id="password-recovery-message" class="message" aria-live="polite"></p>
      <p class="muted"><a href="/login.html">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
