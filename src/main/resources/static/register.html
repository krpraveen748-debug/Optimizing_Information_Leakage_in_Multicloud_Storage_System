<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · CloudVault</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">CloudVault</a><nav><a href="/login.html">Sign in</a></nav></header>
  <main class="narrow">
    <section class="panel">
      <p class="eyebrow">Create your account</p><h1>Get started</h1>
      <p class="muted">Passwords must contain at least 12 characters.</p>
      <form id="register-form">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" required maxlength="150">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password"
                 required minlength="12" maxlength="72">
          <button id="register-password-visibility-toggle" class="password-toggle" type="button"
                  aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <button class="button full-width" type="submit">Create account</button>
      </form>
      <p id="form-message" class="message" aria-live="polite"></p>
      <p class="muted">Already registered? <a href="/login.html">Sign in</a></p>
    </section>
  </main>
</body>
</html>
