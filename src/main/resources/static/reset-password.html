<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · CloudVault</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/recovery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">CloudVault</a>
    <nav><a href="/login.html">Sign in</a></nav>
  </header>
  <main class="narrow">
    <section class="panel">
      <p class="eyebrow">Verified reset link required</p>
      <h1>Choose a new password</h1>
      <p id="reset-password-message" class="message" aria-live="polite">Checking reset link…</p>
      <form id="reset-password-form" hidden>
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" required minlength="12" maxlength="72" autocomplete="new-password">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirmPassword" type="password" required minlength="12" maxlength="72" autocomplete="new-password">
        <button id="reset-password-submit" class="button full-width" type="submit">Reset password</button>
      </form>
      <p class="muted"><a href="/login.html">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
