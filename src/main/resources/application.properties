spring.application.name=multicloud-storage
server.port=8080
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/multicloud_storage?serverTimezone=UTC&sslMode=PREFERRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.user=${DB_MIGRATION_USERNAME}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
spring.servlet.multipart.file-size-threshold=2MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
logging.level.root=INFO
logging.level.com.praveen.multicloud=INFO
logging.level.org.springframework.jdbc.core=INFO
app.storage.cloud1=${APP_STORAGE_CLOUD1:./storage/cloud1}
app.storage.cloud2=${APP_STORAGE_CLOUD2:./storage/cloud2}
app.storage.cloud3=${APP_STORAGE_CLOUD3:./storage/cloud3}
app.chunk.size=65536
app.upload.max-size-bytes=104857600
app.encryption.key-ring=${APP_ENCRYPTION_KEY_RING:}
app.encryption.active-key-id=${APP_ENCRYPTION_ACTIVE_KEY_ID:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.recovery.base-url=${APP_RECOVERY_BASE_URL:http://localhost:8080}
app.recovery.mail-from=${APP_RECOVERY_MAIL_FROM:no-reply@localhost}
app.recovery.token-ttl-minutes=${APP_RECOVERY_TOKEN_TTL_MINUTES:15}
app.similarity.minhash.permutations=${APP_SIMILARITY_MINHASH_PERMUTATIONS:128}
app.similarity.minhash.seed=${APP_SIMILARITY_MINHASH_SEED:20261119}
app.similarity.shingle-size=${APP_SIMILARITY_SHINGLE_SIZE:8}
app.similarity.bloom.bit-size=${APP_SIMILARITY_BLOOM_BIT_SIZE:1048576}
app.similarity.bloom.hash-count=${APP_SIMILARITY_BLOOM_HASH_COUNT:7}
app.leakage.high-similarity-threshold=${APP_LEAKAGE_HIGH_SIMILARITY_THRESHOLD:0.75}
