<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CloudVault</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">CloudVault</a><nav><a href="/register.html">Create account</a></nav></header>
  <main class="narrow">
    <section class="panel">
      <p class="eyebrow">Welcome back</p><h1>Sign in</h1>
      <p class="muted">Use your registered email and password.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="password-visibility-toggle" class="password-toggle" type="button"
                  aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <button class="button full-width" type="submit">Sign in</button>
      </form>
      <p id="form-message" class="message" aria-live="polite"></p>
      <p class="recovery-links">
        <a href="/forgot-email.html">Forgot email?</a>
        <span aria-hidden="true">·</span>
        <a href="/forgot-password.html">Forgot password?</a>
      </p>
      <p class="muted">New here? <a href="/register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
